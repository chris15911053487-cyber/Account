<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 - 记账本</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="nav" id="navbar"></header>

  <main class="page">
    <div class="page-header">
      <div>
        <div class="page-title">👥 用户管理</div>
        <div class="page-subtitle">管理系统用户，分配账号权限</div>
      </div>
      <button class="btn btn-primary" onclick="openCreateModal()">＋ 新建用户</button>
    </div>

    <div class="card">
      <div id="userTableWrap">
        <div class="loading"><div class="spinner"></div>加载中...</div>
      </div>
    </div>
  </main>

  <!-- 新建/编辑用户弹窗 -->
  <div class="modal-overlay hidden" id="userModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">新建用户</span>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <form id="userForm">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" class="form-control" id="fUsername" required />
        </div>
        <div class="form-group">
          <label class="form-label">显示名称</label>
          <input type="text" class="form-control" id="fDisplayName" required />
        </div>
        <div class="form-group">
          <label class="form-label" id="pwdLabel">密码</label>
          <input type="password" class="form-control" id="fPassword" placeholder="留空则不修改" />
        </div>
        <div class="form-group">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="fIsAdmin" />
            <span class="form-label" style="margin:0">设为管理员</span>
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" onclick="closeModal()">取消</button>
          <button type="submit" class="btn btn-primary" id="submitBtn">确认</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/utils.js"></script>
  <script>
    requireAdmin();
    let users = [];
    let editingId = null;

    async function loadUsers() {
      try {
        users = await apiFetch('/admin/users');
        renderTable();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    function renderTable() {
      const wrap = document.getElementById('userTableWrap');
      if (!users.length) {
        wrap.innerHTML = '<div class="empty"><div class="empty-icon">👥</div><p>暂无用户</p></div>';
        return;
      }
      wrap.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>用户名</th><th>显示名称</th><th>角色</th>
                <th data-hide-mobile>状态</th><th data-hide-mobile>创建时间</th><th>操作</th>
              </tr>
            </thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td><span class="tag">${u.username}</span></td>
                  <td>${u.display_name}</td>
                  <td>${u.is_admin ? '<span class="status-badge status-in_progress">管理员</span>' : '<span class="status-badge status-approved">普通用户</span>'}</td>
                  <td data-hide-mobile>${u.is_active ? '<span class="status-badge status-approved">正常</span>' : '<span class="status-badge status-rejected">已禁用</span>'}</td>
                  <td data-hide-mobile class="text-muted">${fmtDateShort(u.created_at)}</td>
                  <td>
                    <button class="btn btn-ghost btn-sm" onclick="openEditModal(${u.id})">编辑</button>
                    <button class="btn btn-sm ${u.is_active ? 'btn-danger' : 'btn-success'}" onclick="toggleActive(${u.id}, ${u.is_active})">
                      ${u.is_active ? '禁用' : '启用'}
                    </button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function openCreateModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = '新建用户';
      document.getElementById('fUsername').value = '';
      document.getElementById('fUsername').disabled = false;
      document.getElementById('fDisplayName').value = '';
      document.getElementById('fPassword').value = '';
      document.getElementById('fPassword').required = true;
      document.getElementById('pwdLabel').textContent = '密码';
      document.getElementById('fIsAdmin').checked = false;
      document.getElementById('userModal').classList.remove('hidden');
    }

    function openEditModal(id) {
      const u = users.find(x => x.id === id);
      if (!u) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = '编辑用户';
      document.getElementById('fUsername').value = u.username;
      document.getElementById('fUsername').disabled = true;
      document.getElementById('fDisplayName').value = u.display_name;
      document.getElementById('fPassword').value = '';
      document.getElementById('fPassword').required = false;
      document.getElementById('pwdLabel').textContent = '新密码（留空不修改）';
      document.getElementById('fIsAdmin').checked = u.is_admin;
      document.getElementById('userModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('userModal').classList.add('hidden');
    }

    document.getElementById('userForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;

      const payload = {
        display_name: document.getElementById('fDisplayName').value.trim(),
        is_admin: document.getElementById('fIsAdmin').checked,
      };
      const pwd = document.getElementById('fPassword').value;
      if (pwd) payload.password = pwd;

      try {
        if (editingId) {
          await apiFetch(`/admin/users/${editingId}`, { method: 'PATCH', body: JSON.stringify(payload) });
          toast('用户已更新', 'success');
        } else {
          await apiFetch('/admin/users', {
            method: 'POST',
            body: JSON.stringify({
              username: document.getElementById('fUsername').value.trim(),
              password: pwd,
              display_name: payload.display_name,
              is_admin: payload.is_admin,
            })
          });
          toast('用户已创建', 'success');
        }
        closeModal();
        loadUsers();
      } catch (err) {
        toast(err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    });

    async function toggleActive(id, currentActive) {
      try {
        await apiFetch(`/admin/users/${id}`, { method: 'PATCH', body: JSON.stringify({ is_active: !currentActive }) });
        toast(currentActive ? '已禁用' : '已启用', 'success');
        loadUsers();
      } catch (err) {
        toast(err.message, 'error');
      }
    }

    renderNav('admin').then(() => loadUsers());
  </script>
</body>
</html>
